  .skilltag{

  @media(min-width:640px){.skilltag{display:inline-block}}
  .chev{color:var(--chalk-dim2);font-size:14px;transition:transform .2s;flex-shrink:0}

  .topic-desc{font-size:13px;color:var(--chalk-dim2);line-height:1.6;margin-bottom:14px}
  .tradeoff-box{
    background:var(--board);
    border:1px solid var(--rule);
    border-left:3px solid var(--blue);

    padding:10px 13px;

  .tradeoff-box .tlabel{
    font-family:'Space Mono',monospace;font-size:9.5px;letter-spacing:0.09em;text-transform:uppercase;

  .tradeoff-box p{font-size:12.5px;color:var(--chalk-dim2);line-height:1.6}

  .ladder{display:flex;flex-direction:column;gap:6px}
  .ladder-opt{
    display:flex;align-items:center;gap:10px;
    padding:8px 10px;border-radius:6px;

    cursor:pointer;

    transition:all .12s;

  .ladder-opt.selected[data-l="2"]{border-color:var(--blue)}
  .ladder-opt.selected[data-l="3"]{border-color:var(--green-ok)}

// ===== Pomodoro timer (global, keeps running across modal opens) =====
// Uses an absolute end timestamp rather than pure tick-counting so it stays
// accurate even if the browser throttles setInterval in a backgrounded tab.
let pomo = {remaining:25*60, mode:'work', running:false, timerId:null, endTime:null};

function updatePomoDisplay(){
  const timeEl = document.getElementById('pomo-time');
  if(!timeEl) return;
  const m = Math.floor(pomo.remaining/60).toString().padStart(2,'0');
  const s = (pomo.remaining%60).toString().padStart(2,'0');
  timeEl.textContent = `${m}:${s}`;
  document.getElementById('pomo-mode').textContent = pomo.mode==='work' ? 'Work session' : 'Break';
  document.getElementById('pomo-startpause').textContent = pomo.running ? 'Pause' : 'Start';
}

function pomoToggle(){
  if(pomo.running){
    clearInterval(pomo.timerId);
    pomo.running=false;
  } else {
    pomo.running=true;
    pomo.endTime = Date.now() + pomo.remaining*1000;
    pomo.timerId=setInterval(pomoTick, 1000);
  }
  updatePomoDisplay();
}

function pomoTick(){
  pomo.remaining = Math.max(0, Math.round((pomo.endTime - Date.now())/1000));
  if(pomo.remaining<=0){
    if(pomo.mode==='work'){
      dailyLog.minutes += 25;
      saveDailyLog();
      pomo.mode='break';
      pomo.remaining=5*60;
      pomo.endTime = Date.now() + pomo.remaining*1000;
      showToast('Work session complete — take a break!');
      drawRings();
    } else {
      clearInterval(pomo.timerId);
      pomo.running=false;
      pomo.mode='work';
      pomo.remaining=25*60;
      pomo.endTime=null;
      showToast('Break over — ready for another round');
    }
  }
  updatePomoDisplay();
}

function pomoReset(){
  clearInterval(pomo.timerId);
  pomo.running=false; pomo.mode='work'; pomo.remaining=25*60; pomo.endTime=null;
  updatePomoDisplay();
}

// ===== Activity rings =====
function pythonCountToday(){ return dailyLog.completedIds.filter(id=>TOPICS[id] && TOPICS[id].skill==='Python').length; }
function aimlCountToday(){ return dailyLog.completedIds.filter(id=>TOPICS[id] && TOPICS[id].skill!=='Python').length; }

function drawRings(){
  const svg = document.getElementById('rings-svg');
  if(!svg) return;
  const cx=70, cy=70;
  const rings = [
    {r:60, color:'#82AECB', prog: Math.min(dailyLog.minutes/60,1)},
    {r:44, color:'#C1685A', prog: Math.min(pythonCountToday()/2,1)},
    {r:28, color:'#8FBF8A', prog: Math.min(aimlCountToday()/2,1)}
  ];
  svg.innerHTML = rings.map(rg=>{
    const circ = 2*Math.PI*rg.r;
    const offset = circ*(1-rg.prog);
    return `<circle cx="${cx}" cy="${cy}" r="${rg.r}" fill="none" stroke="#3B4B41" stroke-width="9"/>
      <circle cx="${cx}" cy="${cy}" r="${rg.r}" fill="none" stroke="${rg.color}" stroke-width="9"
        stroke-linecap="round" stroke-dasharray="${circ}" stroke-dashoffset="${offset}"
        transform="rotate(-90 ${cx} ${cy})" style="transition:stroke-dashoffset .4s"/>`;
  }).join('');
}

// ===== Quizzes =====
let currentQuizQuestions = [];
let currentQuizPhase = null;
let currentQuizAnswers = [];

function getQuestionsForPhase(phaseName){
  return Object.keys(QUIZ_BANK).filter(title=>{
    const t = TOPICS.find(x=>x.title===title);
    return t && t.phase===phaseName;
  }).map(title=>QUIZ_BANK[title]);
}
function getQuestionsForToday(){
  return Object.keys(QUIZ_BANK).filter(title=>{
    const t = TOPICS.find(x=>x.title===title);
    return t && dailyLog.completedIds.includes(t.id);
  }).map(title=>QUIZ_BANK[title]);
}
function quizBtnId(phaseName){ return 'quizbtn-'+phaseName.replace(/[^a-zA-Z0-9]/g,''); }

function openQuiz(phaseName){
  const qs = getQuestionsForPhase(phaseName);
  if(qs.length===0){ showToast('No quiz available for this phase yet'); return; }
  currentQuizQuestions = qs;
  currentQuizPhase = phaseName;
  currentQuizAnswers = new Array(qs.length).fill(null);
  document.getElementById('quiz-phase-label').textContent = phaseName;
  document.getElementById('quiz-title').textContent = 'Phase check';
  renderQuizBody();
  document.getElementById('quiz-overlay').classList.add('open');
}

function openDailyQuiz(){
  const qs = getQuestionsForToday();
  if(qs.length===0){ showToast('Mark at least one topic complete today first'); return; }
  currentQuizQuestions = qs;
  currentQuizPhase = null;
  currentQuizAnswers = new Array(qs.length).fill(null);
  document.getElementById('quiz-phase-label').textContent = "Today's completed topics";
  document.getElementById('quiz-title').textContent = "Today's check-in";
  renderQuizBody();
  document.getElementById('quiz-overlay').classList.add('open');
}

function closeQuiz(){
  document.getElementById('quiz-overlay').classList.remove('open');
}

function renderQuizBody(){
  const body = document.getElementById('quiz-body');
  body.innerHTML = currentQuizQuestions.map((q,qi)=>`
    <div class="quiz-q">
      <div class="quiz-q-text">${qi+1}. ${q.q}</div>
      ${q.options.map((opt,oi)=>`<button class="quiz-opt" id="qopt-${qi}-${oi}" onclick="answerQuiz(${qi},${oi})">${opt}</button>`).join('')}
    </div>`).join('') + `<button class="pomo-btn primary" style="width:100%;margin-top:6px" onclick="submitQuiz()">Submit</button><div id="quiz-result-box"></div>`;
}

function answerQuiz(qi, oi){
  currentQuizAnswers[qi]=oi;
  const q = currentQuizQuestions[qi];
  document.querySelectorAll(`[id^="qopt-${qi}-"]`).forEach(btn=>btn.classList.remove('correct','incorrect'));
  document.getElementById(`qopt-${qi}-${oi}`).classList.add(oi===q.correct?'correct':'incorrect');
  if(oi!==q.correct) document.getElementById(`qopt-${qi}-${q.correct}`).classList.add('correct');
}

function submitQuiz(){
  const total = currentQuizQuestions.length;
  let score=0;
  currentQuizQuestions.forEach((q,qi)=>{ if(currentQuizAnswers[qi]===q.correct) score++; });
  const pass = (score/total) >= 0.7;
  document.getElementById('quiz-result-box').innerHTML =
    `<div class="quiz-result ${pass?'pass':'fail'}">${score}/${total} correct — ${pass?'Passed! 🎉':'Not quite — review and retry.'}</div>`;
  if(currentQuizPhase && pass){
    quizResults[currentQuizPhase] = {passed:true, score, total};
    saveQuizResults();
    const btn = document.getElementById(quizBtnId(currentQuizPhase));
    if(btn){ btn.classList.add('passed'); btn.textContent='Phase check ✓ passed'; }
    showToast('Phase check passed!');
  }
}

function markPassedQuizButtons(){
  Object.keys(quizResults).forEach(phaseName=>{
    if(quizResults[phaseName] && quizResults[phaseName].passed){
      const btn = document.getElementById(quizBtnId(phaseName));
      if(btn){ btn.classList.add('passed'); btn.textContent='Phase check ✓ passed'; }
    }
  });
}

function init(){
  try{ const v = localStorage.getItem('fnd-topic-levels'); if(v) state = JSON.parse(v); }catch(e){}
  try{ const v = localStorage.getItem('fnd-daily-log:'+todayStr()); if(v) dailyLog = JSON.parse(v); }catch(e){}
  try{ const v = localStorage.getItem('fnd-quiz-results'); if(v) quizResults = JSON.parse(v); }catch(e){}
  render();
  markPassedQuizButtons();
  pullFromGist(); // fetch latest cross-device state in the background, then re-render
}

const SITE_PASSWORD = '221625';

function tryUnlock(){
  const input = document.getElementById('lock-input');
  const err = document.getElementById('lock-error');
  if(input.value === SITE_PASSWORD){
    sessionStorage.setItem('fnd-unlocked', 'true');
    document.getElementById('lock-overlay').style.display = 'none';
    document.getElementById('main-wrap').style.display = 'block';
    init();
  } else {
    err.textContent = 'Incorrect password';
    input.value = '';
    input.focus();
  }
}

document.getElementById('lock-input').addEventListener('keydown', e=>{
  if(e.key === 'Enter') tryUnlock();
});

if(sessionStorage.getItem('fnd-unlocked') === 'true'){
  document.getElementById('lock-overlay').style.display = 'none';
  document.getElementById('main-wrap').style.display = 'block';
  init();
} else {
  document.getElementById('lock-input').focus();
}
</script>
